<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *; font-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'">
<title>Zenith</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/hls.min.js" defer></script>
<script src="js/sky.js" defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="sky" aria-hidden="true"><canvas id="sky2"></canvas><i class="g1"></i><i class="g2"></i><i class="g3"></i><i class="g4"></i></div>
<div id="titlebar" hidden>
  <div class="tb-drag"><span class="orb small"></span><span>Zenith</span></div>
  <div class="tb-buttons">
    <button data-win="pin" title="Keep on top" aria-label="Keep on top"><svg viewBox="0 0 24 24"><path d="M12 17v5 M5 17h14l-2-5V5h1V3H6v2h1v7z"/></svg></button>
    <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button data-win="maximize" aria-label="Maximize"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></svg></button>
    <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></svg></button>
  </div>
</div>
<div id="app">
  <header class="top" id="top" hidden></header>
  <main id="view" tabindex="-1"><div class="boot"><div class="gateorb"></div></div></main>
</div>
<div id="player" hidden></div>
<div id="reader" hidden></div>
<div id="update" hidden></div>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
