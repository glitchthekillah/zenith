name: Linux native player compatibility
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Verified Linux package build run
        required: true
        type: string
      package_format:
        description: Exercise the bundled AppImage or the installed Debian runtime
        type: choice
        options: [appimage, deb]
        default: appimage
      constrained_network:
        description: Test seeking over a delayed connection with twice the fixture bitrate
        type: boolean
        default: false
      focus_controls:
        description: Isolate real controls and normal video seeks from the sparse subtitle test
        type: boolean
        default: false
      probe_buffers:
        description: Compare buffering configurations through the native-video factory
        type: boolean
        default: false
      x11_thread_probe:
        description: Diagnose early Xlib initialization using an older package
        type: boolean
        default: false
      playbin3_probe:
        description: Compare GstPlay's supported modern playbin3 pipeline
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  playback:
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable diagnostic dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 webkit2gtk-driver libegl1 libgl1-mesa-dri libxdo3 libfuse2 xvfb xauth pulseaudio pulseaudio-utils dbus-x11 ffmpeg imagemagick python3-pil weston gdb
          cargo install tauri-driver --version 2.0.6 --locked
      - name: Fetch and verify candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          # Disposable runner only: capture the native fault, not another
          # ambiguous WebDriver disconnect. Fixtures contain no private media.
          sudo sysctl -w kernel.core_pattern=/tmp/zenith-core.%e.%p
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$CANDIDATE_RUN" --repo glitchthekillah/zenith --name zenith-linux-x64 --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          chmod +x candidate/*.AppImage
          mkdir -p src-tauri/target/release/bundle/appimage
          cp candidate/*.AppImage src-tauri/target/release/bundle/appimage/
          if [[ '${{ inputs.package_format }}' = deb ]]; then
            sudo apt-get install -y ./candidate/*.deb
          fi
      - name: Exercise packaged native video
        env:
          DISPLAY_SYSTEM: ${{ matrix.display }}
          ZENITH_THROTTLED_TEST: ${{ inputs.constrained_network && '1' || '0' }}
          ZENITH_FOCUS_CONTROLS: ${{ inputs.focus_controls && '1' || '0' }}
          ZENITH_PROBE_BUFFERS: ${{ inputs.probe_buffers && '1' || '0' }}
          ZENITH_PROBE_X11_THREADS: ${{ inputs.x11_thread_probe && '1' || '0' }}
          ZENITH_PROBE_PLAYBIN3: ${{ inputs.playbin3_probe && '1' || '0' }}
          ZENITH_NATIVE_APPLICATION: ${{ inputs.package_format == 'deb' && '/usr/bin/zenith' || '' }}
          TAURI_VIDEO_TELEMETRY: '1'
          GST_DEBUG: 'playbin3:4,uridecodebin3:4,queue2:4,decodebin3:4'
        run: |
          ulimit -c unlimited
          export XDG_RUNTIME_DIR=$(mktemp -d /tmp/zenith-runtime.XXXXXXXX)
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=zenith-test
          if [[ "$DISPLAY_SYSTEM" = wayland ]]; then
            export ZENITH_WAYLAND_TEST=1 GDK_BACKEND=wayland WAYLAND_DISPLAY=wayland-zenith LIBGL_ALWAYS_SOFTWARE=1
            weston --backend=headless-backend.so --renderer=gl --socket=wayland-zenith --width=1280 --height=800 --idle-time=0 >/tmp/native-app-weston.log 2>&1 &
            compositor=$!
            trap 'kill "$compositor" 2>/dev/null || true' EXIT
            for attempt in {1..50}; do [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break; sleep .2; done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          fi
          bash tests/check-linux-native-app.sh
      - name: Read native crash traces
        if: failure()
        run: |
          find /tmp -maxdepth 1 -name 'zenith-core.*' -print | while read -r core; do
            executable=$(find /tmp/zenith-native-app.*/squashfs-root -path '*/usr/bin/zenith' -print -quit)
            gdb --batch -ex 'set pagination off' -ex 'thread apply all bt' "$executable" "$core" >"$core.backtrace.txt" 2>&1 || true
            tail -100 "$core.backtrace.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-compat-${{ matrix.display }}
          path: |
            /tmp/native-app-driver.log
            /tmp/native-app-http.log
            /tmp/native-app-weston.log
            /tmp/native-app-surface.png
            /tmp/native-app-controls.png
            /tmp/native-app-menu.png
            /tmp/native-app-player-frame-*.png
            /tmp/native-app-codec-*.png
            /tmp/native-app-pointer-*.png
            /tmp/zenith-core.*.backtrace.txt
          retention-days: 7
