# Builds Zenith for Windows and Linux and publishes a GitHub Release.
# To release: bump "version" in package.json, commit, then push a tag like v0.2.0:
#   git tag v0.2.0 && git push origin v0.2.0
# The installed apps check this repo's releases and update themselves.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Point the updater at this repo (works for forks too)
      - name: Set the update source to this repo
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish=[{provider:'github',owner:process.env.O,repo:process.env.R}];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
        env:
          O: ${{ github.repository_owner }}
          R: ${{ github.event.repository.name }}
      - name: Build and publish
        run: npx electron-builder --publish always ${{ matrix.os == 'windows-latest' && '--win' || '--linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
