name: Linux release builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        default: v0.2.1
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: '1'
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify source version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          git rev-parse HEAD
          rustc --version
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libnotify-dev patchelf libfuse2
      - name: Install locked JavaScript dependencies and test
        run: |
          npm ci
          node --test 'tests/*.test.cjs'
      - name: Build AppImage and Debian package
        run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify and collect Linux packages
        run: |
          mkdir linux-release
          cp src-tauri/target/release/bundle/appimage/*.AppImage linux-release/
          cp src-tauri/target/release/bundle/deb/*.deb linux-release/
          dpkg-deb -f linux-release/*.deb Package Version Architecture
          cd linux-release
          sha256sum *.AppImage *.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Store unsigned Linux packages for local signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenith-linux-x64
          path: linux-release/*
          if-no-files-found: error
          retention-days: 7
