[package]
name = "zenith"
version = "0.2.3"
description = "Watch, read and request from your own Jellyfin, Kavita and Seerr servers."
authors = ["glitch"]
license = "MIT"
edition = "2021"

[lib]
name = "zenith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"
rusty-leveldb = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Media_Audio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
